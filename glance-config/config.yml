        - type: custom-api
          title: Football Fixtures
          cache: 30m

          url: https://api.football-data.org/v4/teams/66/matches?status=SCHEDULED,FINISHED

          headers:
            X-Auth-Token: fe55f8d41b3c49eba3ddc9be52c6ea8c

          template: |
            <div class="football-fixtures" style="padding: 10px;">
              {{ $timezoneOffsetHours := -5 }}

              {{ $jsonData := .JSON }}
              {{ $matches := $jsonData.Array "matches" }}
              {{ $matchCount := len $matches }}

              {{/* --- Last Match --- */}}
              <div style="margin-bottom: 12px;">
                <div class="color-subdue" style="font-size: 0.8em; margin-bottom: 2px; text-transform: uppercase;">Last Match</div>
                {{ $lastFound := false }}
                {{ $lastHomeTeam := "N/A" }}
                {{ $lastAwayTeam := "N/A" }}
                {{ $lastHomeScore := "?" }}
                {{ $lastAwayScore := "?" }}
                {{ $lastDate := "N/A" }}

                {{ range $matches }}
                  {{ $matchData := .Value }} {{/* Get underlying map/object */}}
                  {{ $status := index $matchData "status" }}
                  {{ if and $status (eq ($status | printf "%s") "FINISHED") }}
                    {{ $lastFound = true }}

                    {{ $homeTeamObj := index $matchData "homeTeam" }}
                    {{ $awayTeamObj := index $matchData "awayTeam" }}
                    {{ if $homeTeamObj }}{{ $lastHomeTeam = index $homeTeamObj "name" | printf "%s" }}{{ else }}{{ $lastHomeTeam = "N/A" }}{{ end }}
                    {{ if $awayTeamObj }}{{ $lastAwayTeam = index $awayTeamObj "name" | printf "%s" }}{{ else }}{{ $lastAwayTeam = "N/A" }}{{ end }}

                    {{ $lastHomeScore = "?" }} {{/* Default */}}
                    {{ $lastAwayScore = "?" }} {{/* Default */}}
                    {{ $scoreObj := index $matchData "score" }}
                    {{ if $scoreObj }}
                      {{ $fullTimeObj := index $scoreObj "fullTime" }}
                      {{ if $fullTimeObj }}
                        {{ $homeScoreVal := index $fullTimeObj "home" }}
                        {{ $awayScoreVal := index $fullTimeObj "away" }}
                        {{/* Check if score value is not nil before formatting */}}
                        {{ if ne $homeScoreVal nil }} {{/* Check for not nil */}}
                            {{ $lastHomeScore = $homeScoreVal | printf "%.0f" }}
                        {{ else }}
                            {{ $lastHomeScore = "?" }}
                        {{ end }}
                        {{ if ne $awayScoreVal nil }} {{/* Check for not nil */}}
                            {{ $lastAwayScore = $awayScoreVal | printf "%.0f" }}
                        {{ else }}
                            {{ $lastAwayScore = "?" }}
                        {{ end }}
                      {{ end }}
                    {{ end }}

                    {{ $dateVal := index $matchData "utcDate" }}
                    {{ if $dateVal }}{{ $lastDate = $dateVal | printf "%s" }}{{ else }}{{ $lastDate = "N/A" }}{{ end }}
                  {{ end }}
                {{ end }}

                {{/* --- Display Last Match --- */}}
                {{ if $lastFound }}
                  <div class="color-primary" style="font-size: 1.1em;">
                    {{ $lastHomeTeam }} {{ $lastHomeScore }} - {{ $lastAwayScore }} {{ $lastAwayTeam }}
                  </div>
                  {{ $dateStr := $lastDate }}
                  {{ if and $dateStr (ne $dateStr "N/A") (ge (len $dateStr) 16) }}
                    {{ $year := slice $dateStr 0 4 }}
                    {{ $month := slice $dateStr 5 7 }}
                    {{ $day := slice $dateStr 8 10 }}
                    {{ $hour := slice $dateStr 11 13 }}
                    {{ $minute := slice $dateStr 14 16 }}
                    <div class="color-subdue" style="font-size: 0.9em;">
                      {{ $day }}-{{ $month }}-{{ $year }} {{ $hour }}:{{ $minute }} UTC
                      {{/* Display the offset */}}
                      {{ if $timezoneOffsetHours }}
                        (Offset: {{ printf "%+d" $timezoneOffsetHours }}h)
                      {{ end }}
                    </div>
                  {{ else if $dateStr }}
                    {{/* Fallback if date string is not in expected format */}}
                    <div class="color-subdue" style="font-size: 0.9em;">{{ $dateStr }}</div>
                  {{ end }}
                {{ else }}
                  <div class="color-subdue" style="font-size: 1.1em;">No finished matches found</div>
                {{ end }}
              </div>
        
              {{/* --- Next Match --- */}}
              <div>
                <div class="color-subdue" style="font-size: 0.8em; margin-bottom: 2px; text-transform: uppercase;">Next Match</div>
                {{ $nextFound := false }}
                {{ $nextHomeTeam := "N/A" }}
                {{ $nextAwayTeam := "N/A" }}
                {{ $nextDate := "N/A" }}

                {{ range $matches }}
                  {{ $matchData := .Value }}
                  {{ if not $nextFound }}
                    {{ $status := index $matchData "status" }}
                    {{ if $status }}
                      {{ $statusStr := $status | printf "%s" }}
                      {{/* The API might use TIMED or SCHEDULED for upcoming */}}
                      {{ if or (eq $statusStr "SCHEDULED") (eq $statusStr "TIMED") }}
                        {{ $nextFound = true }}
                        {{ $homeTeamObj := index $matchData "homeTeam" }}
                        {{ $awayTeamObj := index $matchData "awayTeam" }}
                        {{ if $homeTeamObj }}{{ $nextHomeTeam = index $homeTeamObj "name" | printf "%s" }}{{ else }}{{ $nextHomeTeam = "N/A" }}{{ end }}
                        {{ if $awayTeamObj }}{{ $nextAwayTeam = index $awayTeamObj "name" | printf "%s" }}{{ else }}{{ $nextAwayTeam = "N/A" }}{{ end }}
                        {{ $dateVal := index $matchData "utcDate" }}
                        {{ if $dateVal }}{{ $nextDate = $dateVal | printf "%s" }}{{ else }}{{ $nextDate = "N/A" }}{{ end }}
                      {{ end }}
                    {{ end }}
                  {{ end }}
                {{ end }}

                {{/* --- Display Next Match --- */}}
                {{ if $nextFound }}
                  <div class="color-primary" style="font-size: 1.1em;">
                    {{ $nextHomeTeam }} vs {{ $nextAwayTeam }}
                  </div>
                  {{ $dateStr := $nextDate }}
                  {{ if and $dateStr (ne $dateStr "N/A") (ge (len $dateStr) 16) }}
                    {{ $year := slice $dateStr 0 4 }}
                    {{ $month := slice $dateStr 5 7 }}
                    {{ $day := slice $dateStr 8 10 }}
                    {{ $hour := slice $dateStr 11 13 }}
                    {{ $minute := slice $dateStr 14 16 }}
                    <div class="color-subdue" style="font-size: 0.9em;">
                      {{ $day }}-{{ $month }}-{{ $year }} {{ $hour }}:{{ $minute }} UTC
                      {{/* Display the offset */}}
                      {{ if $timezoneOffsetHours }}
                        (Offset: {{ printf "%+d" $timezoneOffsetHours }}h)
                      {{ end }}
                    </div>
                  {{ else if $dateStr }}
                    {{/* Fallback if date string is not in expected format */}}
                    <div class="color-subdue" style="font-size: 0.9em;">{{ $dateStr }}</div>
                  {{ end }}
                {{ else }}
                  <div class="color-subdue" style="font-size: 1.1em;">No upcoming matches found</div>
                {{ end }}
              </div>
            </div>

        - type: custom-api
          title: NHL Today
          cache: 5s
          url: https://api-web.nhle.com/v1/score/now
          template: |
            {{ $myTeam := "NYR" }}
            {{ $games := .JSON.Array "games" }}
            {{ define "gameItem" }}
              {{ $toolTipEnabled := true }}
              {{ $awayTeamColor := "" }}
              {{ $homeTeamColor := "" }}
              {{ $situationDescriptionHome := "" }}
              {{ $situationDescriptionAway := "" }}
              {{ $situationStrength := "" }}
              {{ $homeTeam := .String "homeTeam.abbrev" }}
              {{ $awayTeam := .String "awayTeam.abbrev" }}
              {{ $homeTeamScores := "" }}
              {{ $awayTeamScores := "" }}
              {{ range $index, $desc := .Array "goals" }}
                  {{ $teamAbbrev := .String "teamAbbrev" }}
                  {{ $playerName := .String "name.default" }}
                  {{ $timeScored := .String "timeInPeriod" }}
                  {{ $periodScored := .Int "period" }}
                  {{ if eq $awayTeam $teamAbbrev }}
                      {{ $awayTeamScores = (printf "%s %s %s(%d)" $awayTeamScores $playerName $timeScored $periodScored) }}
                  {{ else if eq $homeTeam $teamAbbrev }}
                      {{ $homeTeamScores = (printf "%s %s %s(%d)" $homeTeamScores $playerName $timeScored $periodScored) }}
                  {{ end }}
              {{ end }}
              {{ $gameState := .String "gameState" }}
              {{ $currentLabel := "" }}
              {{ if or (eq $gameState "OFF") (eq $gameState "FINAL") }}
                  {{ $lastPeriodType := .String "gameOutcome.lastPeriodType" }}
                  {{ $currentLabel = "Final" }}
                  {{ if or (eq $lastPeriodType "OT") (eq $lastPeriodType "SO") }}
                      {{ $currentLabel = (printf "%s %s" $currentLabel $lastPeriodType) }}
                  {{ end }}
              {{ end }}
              {{ if or (eq $gameState "FUT") (eq $gameState "PRE") }}
                  {{ $gameTime := (.String "startTimeUTC" | parseTime "rfc3339").In now.Location }}
                  {{ $currentLabel = (printf "%02d:%02d" $gameTime.Hour $gameTime.Minute) }}
              {{ end }}
              {{ if or (eq $gameState "LIVE") (eq $gameState "CRIT") }}
                  {{ $period := .Int "period" }}
                  {{ $periodString := .String "period" }}
                  {{ $timeRemaining := .String "clock.timeRemaining" }}
                  {{ $intermission := .Int "clock.inIntermission" }}
                  {{ $periodType := .String "periodDescriptor.periodType" }}
                  {{ if eq $period 1 }}
                  {{ $addonValue := "st" }}
                  {{ if eq $intermission 1 }}
                      {{ $addonValue = printf "%s Int" $addonValue }}
                  {{ end }}
                  {{ $currentLabel = (printf "%s%s %s" $periodString $addonValue $timeRemaining) }}
                  {{ else if eq $period 2 }}
                      {{ $addonValue := "nd" }}
                      {{ if eq $intermission 1 }}
                          {{ $addonValue = printf "%s Int" $addonValue }}
                      {{ end }}
                  {{ $currentLabel = (printf "%s%s %s" $periodString $addonValue $timeRemaining) }}
                  {{ else if eq $period 3 }}
                      {{ $addonValue := "rd" }}
                      {{ if eq $intermission 1 }}
                          {{ $addonValue = printf "%s Int" $addonValue }}
                      {{ end }}
                  {{ $currentLabel = (printf "%s%s %s" $periodString $addonValue $timeRemaining) }}
                  {{ else }}
                  {{ $currentLabel = $periodType }} 
                      {{ if not (eq $periodType "SO") }}
                          {{ $currentLabel = (printf "%s %s" $periodType $timeRemaining) }}
                      {{ end }}
                  {{ end }}
              {{ end }}
              {{ if .Exists "situation" }}
                  {{ if .Exists "situation.awayTeam.situationDescriptions" }}
                      {{ $awayTeamColor = "color-negative" }}
                      {{ range $index, $desc := .Array "situation.awayTeam.situationDescriptions" }}
                            {{ $situationDescriptionAway = (printf "%s %s" $situationDescriptionAway $desc.Value) }}
                      {{ end }} 
                  {{ end }}
                  {{ if .Exists "situation.homeTeam.situationDescriptions" }}
                      {{ $homeTeamColor = "color-positive" }}
                      {{ range $index, $desc := .Array "situation.homeTeam.situationDescriptions" }}
                          {{ $situationDescriptionHome = (printf "%s %s" $situationDescriptionHome $desc.Value) }}
                      {{ end }}
                  {{ end }}
                {{ $situationStrength = concat "(" (.String "situation.awayTeam.strength") "v" (.String "situation.homeTeam.strength") ")" }}
              {{ end }}
              <table>
                  <tr>
                      <td>
                          <a target="_blank" class="size-h3 color-highlight block text-truncate" href="https://www.nhl.com{{ .String "gameCenterLink" }}/">
                            <span class= {{ $awayTeamColor }} > {{ .String "awayTeam.name.default" }} </span> vs <span class= {{ $homeTeamColor }} > {{ .String "homeTeam.name.default" }} </span>
                          </a>
                      </td>
                  </tr>
                  <tr>
                      <td>
                          <span class= {{ $awayTeamColor }} > {{ $situationDescriptionAway }} </span> <span class= {{ $homeTeamColor }} > {{ $situationDescriptionHome }} </span> <span> {{ .String "situation.timeRemaining" }} {{ $situationStrength }}</span>
                      </td>
                  </tr>
              </table>
              <table>
                  <tr>
                      <td data-popover-type="html">
                          {{ if and (not (eq $awayTeamScores "")) (eq $toolTipEnabled true) }}
                              <div data-popover-html>
                                {{ $awayTeamScores }}
                              </div>
                          {{ end }}
                        <img style="float: left" width="50" height="auto" src={{ .String "awayTeam.logo" }}>
                      </td>
                      <td data-popover-type="html">
                          {{ if and (not (eq $awayTeamScores "")) (eq $toolTipEnabled true) }}
                            <div data-popover-html>
                              {{ $awayTeamScores }}
                            </div>
                          {{ end }}
                        <p style="font-size:25px"> {{ .String "awayTeam.score" }} </p>
                      </td>
                      <td>
                          <p style="font-size:25px">-</p>
                      </td>
                      <td data-popover-type="html">
                        {{ if and (not (eq $homeTeamScores "")) (eq $toolTipEnabled true) }}
                          <div data-popover-html>
                            {{ $homeTeamScores }}
                          </div>
                        {{ end }}
                        <p style="font-size:25px"> {{ .String "homeTeam.score" }} </p>
                      </td>
                      <td data-popover-type="html">
                        {{ if and (not (eq $homeTeamScores "")) (eq $toolTipEnabled true) }}
                          <div data-popover-html>
                            {{ $homeTeamScores }}
                          </div>
                        {{ end }}
                        <img style="float: left" width="50" height="auto" src={{ .String "homeTeam.logo" }}>
                      </td>
                      <td>
                          {{ $currentLabel }}
                      </td>
                  </tr>
              </table>
            {{ end }}        

            <ul class="list list-gap-10 collapsible-container" data-collapse-after="10">
            {{ range $game := $games }}
                {{ if and (or (eq ($game.String "homeTeam.abbrev") $myTeam) (eq ($game.String "awayTeam.abbrev") $myTeam) (eq "ALL" $myTeam)) }}
                {{ $state := $game.String "gameState" }}
                    {{ if not (or (eq $state "FINAL") (eq $state "OFF")) }}
                        {{ template "gameItem" $game }}
                    {{ end }}
                {{ end }}
            {{ end }}
            {{ range $game := $games }}
                {{ if and (or (eq ($game.String "homeTeam.abbrev") $myTeam) (eq ($game.String "awayTeam.abbrev") $myTeam) (eq "ALL" $myTeam)) }}
                {{ $state := $game.String "gameState" }}
                    {{ if or (eq $state "FINAL") (eq $state "OFF") }}
                        {{ template "gameItem" $game }}
                    {{ end }}
                {{ end }}
            {{ end }}
            </ul>











    - size: small
      widgets:
        - type: weather
          location: Rockaway Point, New York, United States
          units: imperial # alternatively "metric"
          hour-format: 12h # alternatively "24h"
          # Optionally hide the location from being displayed in the widget
          # hide-location: true

        - type: markets
          markets:
            - symbol: SPY
              name: S&P 500
            - symbol: BTC-USD
              name: Bitcoin
            - symbol: NVDA
              name: NVIDIA
            - symbol: AAPL
              name: Apple
            - symbol: MSFT
              name: Microsoft

        - type: releases
          cache: 1d
          # Without authentication the Github API allows for up to 60 requests per hour. You can create a
          # read-only token from your Github account settings and use it here to increase the limit.
          # token: ...
          repositories:
            - glanceapp/glance
            - Tautulli/Tautulli
            - pyrochlore/obsidian-tracker

        - type: monitor
          cache: 1m
          title: Services
          style: compact
          sites:
            - title: My Github.io
              url: https://csanicola.github.io/

        - type: custom-api
          title: LeetCode Daily Question
          cache: 6h
          url: https://leetcode.com/graphql
          method: POST
          headers:
            Accept: application/json
          body-type: json
          body:
            query: |
              query questionOfToday {
                activeDailyCodingChallengeQuestion {
                  link
                  question {
                    questionId
                    title
                    difficulty
                    topicTags {
                      name
                      slug
                    }
                  }
                }
              }
            operationName: questionOfToday
          template: |
            <div class="leetcode-card">
              <style>
                .leetcode-card {
                  max-width: 600px;
                  margin: 8px auto;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                  transition: transform 0.2s ease, box-shadow 0.2s ease;
                }
                .leetcode-card h1 {
                  font-size: 24px;
                  margin: 0 0 16px;
                  line-height: 1.3;
                }
                .leetcode-card h1 a {
                  color: #8CAAEE;
                  text-decoration: none;
                  transition: color 0.2s ease;
                }
                .leetcode-card h1 a:hover {
                  color: #BAC8FF;
                  text-decoration: underline;
                }
                .leetcode-card p {
                  margin: 8px 0;
                  color: #C6D0F5;
                  font-size: 16px;
                }
                .leetcode-card .difficulty {
                  font-weight: 600;
                  color: #A5ADCE;
                }
                .leetcode-card .difficulty.Easy {
                  color: #A6D189;
                }
                .leetcode-card .difficulty.Medium {
                  color: #E5C890;
                }
                .leetcode-card .difficulty.Hard {
                  color: #E78284;
                }
                .leetcode-card .topics {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 8px;
                  margin: 12px 0;
                }
                .leetcode-card .topic-tag {
                  background: #CA9EE6;
                  color: #303446;
                  padding: 4px 12px;
                  border-radius: 16px;
                  font-size: 14px;
                  font-weight: 500;
                  transition: transform 0.2s ease;
                }
                .leetcode-card .topic-tag:hover {
                  transform: scale(1.05);
                }
                .leetcode-card .premium {
                  color: #E78284;
                  font-weight: 600;
                  margin-top: 12px;
                }
                @media (max-width: 600px) {
                  .leetcode-card {
                    padding: 16px;
                    margin: 8px;
                  }
                  .leetcode-card h1 {
                    font-size: 20px;
                  }
                  .leetcode-card p {
                    font-size: 14px;
                  }
                  .leetcode-card .topic-tag {
                    font-size: 12px;
                    padding: 3px 10px;
                  }
                }
              </style>
              <h1>
                <a href="https://leetcode.com{{ .JSON.String "data.activeDailyCodingChallengeQuestion.link" }}" target="_blank">
                  {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.questionId" }} - {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.title" }}
                </a>
              </h1>
              <p class="difficulty {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.difficulty" }}"><strong>Difficulty:</strong> {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.difficulty" }}</p>
              <p><strong>Topics:</strong></p>
              <div class="topics">
                {{ if .JSON.Exists "data.activeDailyCodingChallengeQuestion.question.topicTags" }}
                  {{ range .JSON.Array "data.activeDailyCodingChallengeQuestion.question.topicTags" }}
                    <span class="topic-tag">{{ .String "name" }}</span>
                  {{ end }}
                {{ else }}
                  <span class="topic-tag">None</span>
                {{ end }}
              </div>
              {{ if .JSON.Bool "data.activeDailyCodingChallengeQuestion.question.paidOnly" }}
                <p class="premium">This is a Premium question</p>
              {{ end }}
            </div>

        - type: custom-api
          title: Trending News (Bluesky)
          url: >-
            https://public.api.bsky.app/xrpc/app.bsky.feed.getFeed?feed=at://did:plc:kkf4naxqmweop7dv4l2iqqf5/app.bsky.feed.generator/news-2-0
          template: |
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
              {{ range .JSON.Array "feed" }}
                {{ if .String "post.embed.external.title" }}
                  <li>
                    <a class="size-title-dynamic color-primary-if-not-visited" href="{{ .String "post.embed.external.uri" }}">{{ .String "post.embed.external.title" }}</a>
                    <ul class="list-horizontal-text">
                      <li>{{ .String "post.author.displayName" }} <a class="visited-indicator" href="https://bsky.app/profile/{{ .String "post.author.did" }}"> @{{ .String "post.author.handle" }}</a></li>
                      <li>{{ .String "post.record.text" }}</li>
                    </ul>
                  </li>
                {{ end }}
              {{ end }}
            </ul>






