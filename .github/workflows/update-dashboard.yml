# .github/workflows/update-dashboard.yml
name: Update and Deploy Dashboard

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick python3-pip
        pip3 install feedparser jupyter
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install Python dependencies
      run: pip install feedparser jupyter
        
    - name: Build Dashboard
      run: ./scripts/build-simple-dashboard.sh
      
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        
    - name: Build site with Jekyll
      run: |
        # Remove problematic files that cause build errors
        rm -f assets/jupyter/blog.ipynb 2>/dev/null || true
        bundle exec jekyll build
      
    - name: Debug - Check if dashboard exists
      run: |
        echo "Checking built dashboard:"
        find _site -name "*dashboard*" -type f
        echo "Contents of _pages:"
        ls -la _pages/
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site